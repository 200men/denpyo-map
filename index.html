<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b3122e">
<title>伝票マップ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=M+PLUS+1+Code:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{
  --bg:#eef0f2; --paper:#fff; --ink:#1b1d21; --muted:#5f6670; --line:#d5d9de; --accent:#b3122e; --accent-ink:#fff; --ok:#1f7a4d;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"M PLUS 1 Code",ui-monospace,monospace; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121417; --paper:#1c1f24; --ink:#eceef1; --muted:#9aa2ad; --line:#30353c; --accent:#ff5a6e; --accent-ink:#1a0006; --ok:#4cc08a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.acts,.stop details{grid-column:2}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:540px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;font-weight:900}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:14px;color:var(--muted)}
.count b{color:var(--accent);font-size:20px}
.add{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.scan{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:900;cursor:pointer;border:0;padding:0 12px}
.scan.sub{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-size:14px;font-weight:700;min-width:64px;flex-direction:column;gap:0;line-height:1.3}
.scan:focus-within,.scan:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.scan input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.scan svg{width:24px;height:24px;flex:none}
.scan.disabled{opacity:.45;pointer-events:none}
.status{font-size:13px;color:var(--muted);min-height:1.4em;text-align:center}
.status.err{color:var(--accent)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

.list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.empty{border:2px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.stop{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 12px 12px;display:grid;grid-template-columns:44px 1fr;gap:4px 12px}
.stop.done{opacity:.55}
.stop.done .num{background:var(--ok)}
.num{grid-row:span 3;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font:900 22px var(--mono)}
.stop-head{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.time{font:600 20px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:2px}
.icon{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.icon:hover{border-color:var(--line)}
.icon:focus-visible{outline:2px solid var(--accent)}
.fields{display:flex;flex-direction:column;gap:6px;min-width:0}
textarea,input.t{width:100%;font:700 16px/1.45 var(--display);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:58px}
input.t{font-size:14px;font-weight:400;padding:6px 10px}
textarea:focus-visible,input.t:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.acts{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 12px;border-radius:10px;
  font:700 15px var(--display);text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:center}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}

.all{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.all .btn.big{min-height:58px;font-size:17px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.all p{margin:0;font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
details{font-size:12px;color:var(--muted)}
details pre{white-space:pre-wrap;font:11px/1.5 var(--mono);background:var(--bg);padding:8px;border-radius:6px;max-height:200px;overflow:auto}
.note{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>伝票マップ</h1>
    <span class="count"><b id="cnt">0</b> / 4件</span>
  </header>

  <div class="add">
    <label class="scan" id="camBtn" for="photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="scanText">撮影して追加</span>
      <input type="file" id="photo" accept="image/*" capture="environment" aria-label="伝票を撮影して追加">
    </label>
    <label class="scan sub" id="galBtn" for="gallery">写真<br>から
      <input type="file" id="gallery" accept="image/*" multiple aria-label="写真から追加（複数選択可）">
    </label>
    <button class="scan sub" id="manualBtn" type="button">手<br>入力</button>
  </div>
  <div class="bar" id="bar" hidden><i id="barFill"></i></div>
  <div class="status" id="status" role="status"></div>

  <ol class="list" id="list"></ol>
  <div class="empty" id="empty">伝票を撮影すると、ここに配達先が並びます（最大4件）。<br>「写真から」なら撮っておいた伝票をまとめて選べます。</div>

  <section class="all" id="allBox" hidden>
    <a class="btn big" id="allRoute" href="#" target="_blank" rel="noopener">未配達をまとめてルート表示</a>
    <p id="allNote">現在地から①→②→③→④の順に回るルートをGoogleマップで開きます。順番は ▲▼ で入れ替えられます。</p>
    <div class="row">
      <button class="btn" id="sortBtn" type="button">時間順に並べる</button>
      <button class="btn" id="clearBtn" type="button">全部消す</button>
    </div>
    <div class="confirm" id="confirmBox" hidden>
      <span>すべての伝票を消しますか？</span>
      <button class="btn" id="clearYes" type="button">消す</button>
      <button class="btn" id="clearNo" type="button">やめる</button>
    </div>
  </section>

  <p class="note">文字の読み取りはこの端末の中で行い、写真は外部に送信しません。初回のみ読み取り用データ（約2MB）をダウンロードします。読み取った住所は必ず目で確認してください。</p>
</div>

<template id="tpl">
  <li class="stop">
    <div class="num"></div>
    <div class="stop-head">
      <span class="time"></span>
      <span class="tools">
        <button class="icon up" type="button" aria-label="順番を上へ">▲</button>
        <button class="icon down" type="button" aria-label="順番を下へ">▼</button>
        <button class="icon del" type="button" aria-label="この伝票を消す">✕</button>
      </span>
    </div>
    <div class="fields">
      <textarea class="addr" rows="2" placeholder="住所を入力"></textarea>
      <input class="t bldg" placeholder="建物・部屋">
    </div>
    <div class="acts">
      <a class="btn primary map" href="#" target="_blank" rel="noopener">マップ</a>
      <a class="btn nav" href="#" target="_blank" rel="noopener">ルート</a>
      <button class="btn doneBtn" type="button">完了</button>
    </div>
    <details><summary>読み取った全文</summary><pre class="raw"></pre></details>
  </li>
</template>

<script>
(() => {
  const MAX = 4;
  const $ = id => document.getElementById(id);
  const MARK = ["①","②","③","④"];
  const mapsUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  const navUrl  = q => "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + encodeURIComponent(q);
  const setStatus = (m, err) => { $("status").textContent = m || ""; $("status").classList.toggle("err", !!err); };

  // ---- 状態（この端末に保存）
  const KEY = "denpyo-stops";
  let stops = [];
  try { stops = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { stops = []; }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(stops)); } catch {} };
  let uid = Date.now();

  function render(){
    const ul = $("list"); ul.textContent = "";
    stops.forEach((s, i) => {
      const li = $("tpl").content.firstElementChild.cloneNode(true);
      li.classList.toggle("done", !!s.done);
      li.querySelector(".num").textContent = i + 1;
      li.querySelector(".time").textContent = s.time || "";
      const a = li.querySelector(".addr"), b = li.querySelector(".bldg");
      a.value = s.address || ""; b.value = s.building || "";
      a.id = "addr-" + s.id; b.id = "bldg-" + s.id;
      const map = li.querySelector(".map"), nav = li.querySelector(".nav");
      const links = () => { const q = s.address.trim();
        map.href = q ? mapsUrl(q) : "#"; nav.href = q ? navUrl(q) : "#";
        map.setAttribute("aria-disabled", !q); nav.setAttribute("aria-disabled", !q); };
      links();
      a.addEventListener("input", () => { s.address = a.value; links(); persist(); updateAll(); });
      b.addEventListener("input", () => { s.building = b.value; persist(); });
      li.querySelector(".raw").textContent = s.raw || "（手入力）";
      const done = li.querySelector(".doneBtn");
      done.textContent = s.done ? "戻す" : "完了"; done.classList.toggle("ok", !s.done);
      done.onclick = () => { s.done = !s.done; persist(); render(); };
      li.querySelector(".up").disabled = i === 0;
      li.querySelector(".down").disabled = i === stops.length - 1;
      li.querySelector(".up").onclick = () => move(i, -1);
      li.querySelector(".down").onclick = () => move(i, 1);
      li.querySelector(".del").onclick = () => { stops.splice(i, 1); persist(); render(); };
      ul.append(li);
    });
    $("empty").hidden = stops.length > 0;
    $("cnt").textContent = stops.length;
    const full = stops.length >= MAX;
    for (const id of ["camBtn","galBtn","manualBtn"]) $(id).classList.toggle("disabled", full);
    $("scanText").textContent = full ? "4件そろいました" : "撮影して追加";
    updateAll();
  }
  function move(i, d){ const j = i + d; if (j < 0 || j >= stops.length) return;
    [stops[i], stops[j]] = [stops[j], stops[i]]; persist(); render(); }

  function updateAll(){
    const todo = stops.filter(s => !s.done && s.address.trim());
    $("allBox").hidden = stops.length === 0;
    const btn = $("allRoute");
    if (!todo.length){ btn.href = "#"; btn.setAttribute("aria-disabled", "true"); btn.textContent = "未配達はありません"; return; }
    btn.setAttribute("aria-disabled", "false");
    const qs = todo.map(s => s.address.trim());
    const dest = qs[qs.length - 1], way = qs.slice(0, -1);
    btn.href = "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + encodeURIComponent(dest)
      + (way.length ? "&waypoints=" + encodeURIComponent(way.join("|")) : "");
    btn.textContent = todo.length === 1 ? "未配達1件のルート表示" : `未配達${todo.length}件をまとめてルート表示`;
    const order = stops.map((s, i) => (!s.done && s.address.trim()) ? MARK[i] : null).filter(Boolean).join("→");
    $("allNote").textContent = `現在地から${order}の順に回るルートをGoogleマップで開きます。順番は ▲▼ で入れ替えられます。`;
  }

  $("sortBtn").onclick = () => {
    stops.sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99")); persist(); render(); };
  $("clearBtn").onclick = () => { $("confirmBox").hidden = false; };
  $("clearNo").onclick = () => { $("confirmBox").hidden = true; };
  $("clearYes").onclick = () => { stops = []; persist(); $("confirmBox").hidden = true; render(); setStatus(""); };
  $("manualBtn").onclick = () => {
    if (stops.length >= MAX) return;
    const s = { id: ++uid, address: "", building: "", time: "", raw: "", done: false };
    stops.push(s); persist(); render();
    const el = document.getElementById("addr-" + s.id); if (el) el.focus();
  };

  // ---- 住所の取り出し
  const PREF = /(北海道|東京都|京都府|大阪府|青森県|岩手県|宮城県|秋田県|山形県|福島県|茨城県|栃木県|群馬県|埼玉県|千葉県|神奈川県|新潟県|富山県|石川県|福井県|山梨県|長野県|岐阜県|静岡県|愛知県|三重県|滋賀県|兵庫県|奈良県|和歌山県|鳥取県|島根県|岡山県|広島県|山口県|徳島県|香川県|愛媛県|高知県|福岡県|佐賀県|長崎県|熊本県|大分県|宮崎県|鹿児島県|沖縄県)/;
  const toHalf = s => s.replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
                       .replace(/[－−‐―ｰ]/g, "-");
  const squash = s => toHalf(s).replace(/[ \t　]+/g, "");
  function parse(text){
    const lines = text.split(/\n/).map(squash).filter(Boolean);
    const out = { address: "", building: "", time: "" };
    const tm = toHalf(text).replace(/\s+/g, "").match(/\d{2}\/\d{1,2}\/\d{1,2}\(.\)(\d{1,2}:\d{2})/);
    if (tm) out.time = tm[1];
    const i = lines.findIndex(l => PREF.test(l));
    if (i < 0) return out;
    let head = lines[i].slice(lines[i].search(PREF)).split(/[>|<\]\[{}~_*$#@]/)[0];
    let joined = head;
    const next = lines[i + 1] || "";
    if (!/\d+(-\d+)+/.test(head) && /^[0-9]/.test(next)) joined += next;
    const m = joined.match(/^(.*?\d+(?:[-ー]\d+)*)(.*)$/);
    if (m){ out.address = m[1].replace(/ー(?=\d)/g, "-"); out.building = m[2].replace(/[^\p{L}\p{N}\-]/gu, ""); }
    else out.address = joined;
    return out;
  }

  // ---- 読み取り
  async function prep(file){
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
    if (!bmp) return file;
    const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    const g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.4)"; g.drawImage(bmp, 0, 0, c.width, c.height);
    return c;
  }
  let worker = null;
  async function getWorker(){
    if (worker) return worker;
    worker = await Tesseract.createWorker("jpn", 1, {
      langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn@1.0.0/4.0.0_best_int",
      logger: m => { if (m.status === "recognizing text") $("barFill").style.width = Math.round(m.progress * 100) + "%"; }
    });
    return worker;
  }

  let busy = false;
  async function scanFiles(files){
    if (busy) return;
    const room = MAX - stops.length;
    if (room <= 0){ setStatus("4件そろっています。配達が終わった伝票を消してから追加してください。", true); return; }
    files = Array.from(files).slice(0, room);
    busy = true; $("bar").hidden = false;
    let ok = 0, ng = 0;
    try {
      const w = await getWorker();
      for (let k = 0; k < files.length; k++){
        $("barFill").style.width = "0";
        setStatus(files.length > 1 ? `読み取り中… ${k + 1} / ${files.length}枚` : "読み取り中…（初回は準備に少し時間がかかります）");
        const { data } = await w.recognize(await prep(files[k]));
        const r = parse(data.text);
        stops.push({ id: ++uid, address: r.address, building: r.building, time: r.time, raw: data.text, done: false });
        r.address ? ok++ : ng++;
        persist(); render();
      }
      if (ng) setStatus(`${ok}件読み取りました。住所が見つからなかった${ng}件は手で入力してください。`, true);
      else setStatus(`${ok}件読み取りました。住所を確認してください。`);
    } catch (e) {
      console.error(e); setStatus("読み取りに失敗しました。通信状態を確認してもう一度お試しください。", true);
    } finally {
      busy = false; $("bar").hidden = true; $("photo").value = ""; $("gallery").value = "";
    }
  }
  $("photo").addEventListener("change", e => e.target.files.length && scanFiles(e.target.files));
  $("gallery").addEventListener("change", e => e.target.files.length && scanFiles(e.target.files));

  render();
})();
</script>
</body>
</html>
